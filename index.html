function statBadge(s){return `<span class="status ${statusClass(s)}">${s}</span>`}
function row(d){return `<tr><td><div class="client"><i class="avatar">${d.initials}</i><span><b>${d.name}</b><small>Pedido ${d.id}</small></span></div></td><td>${d.address}</td><td>${d.time}</td><td>${statBadge(d.status)}</td><td><button class="rowmore" data-code="${d.id}" aria-label="Abrir entrega">›</button></td></tr>`}
function manager(){const routeCount=orders.filter(x=>["Em rota","Próxima"].includes(x.status)).length,done=orders.filter(x=>x.status==="Concluída"||x.status==="Recebido").length;return `<div class="heading"><div><div class="eyebrow">QUARTA-FEIRA · 14 DE OUTUBRO</div><h1>Bom dia! 👋</h1><p>Veja como estão as entregas da sua loja hoje.</p></div><button class="btn primary" id="newOrder">＋　Nova entrega</button></div>
<div class="metrics"><article class="metric"><div class="metricline">Entregas de hoje<span class="metricicon">▣</span></div><strong>${orders.length}<small>pedidos</small></strong></article><article class="metric"><div class="metricline">Em andamento<span class="metricicon">🚚</span></div><strong>${routeCount}<small>na rota</small></strong></article><article class="metric"><div class="metricline">Concluídas<span class="metricicon">✓</span></div><strong>${done}<small>entregues</small></strong></article><article class="metric"><div class="metricline">Precisam de atenção<span class="metricicon" style="background:var(--orange-pale);color:#a9681f">!</span></div><strong>${orders.filter(x=>x.status==="Não entregue").length}<small>ocorrências</small></strong></article></div>
<div class="layout"><article class="card"><div class="cardhead"><div><h2>Rota de hoje</h2><p>Rafael está a caminho das próximas entregas</p></div><button class="textbtn" data-mode="driver">Ver como motorista　→</button></div><div class="map">${mapSvg()}<span class="mapbadge"><i></i>Posição aproximada do caminhão</span></div><div class="route-summary"><span class="truckicon">🚚</span><span><b>Rota 03 · Caminhão 02</b><small>Motorista: Rafael Martins · 5 paradas</small></span><span class="right"><b>3 de 5</b><small>entregas concluídas</small></span></div></article>
<div class="stack"><article class="card"><div class="cardhead"><div><h2>Motorista</h2><p>Rota ativa desde 9h10</p></div><span class="online">● Em rota</span></div><div class="driver"><i class="avatar">RM</i><span><b>Rafael Martins</b><small>Caminhão 02 · placa IXY-4A21</small></span></div><div class="progressbox"><div class="progresslabel"><span>Andamento da rota</span><b>60%</b></div><div class="progress"><i></i></div></div><div class="stops"><div class="stop"><i class="stopnum">4</i><span><b>Próxima parada</b><small>${orders.find(x=>x.status==="Em rota")?.name||"Marcos Oliveira"} · Jardim das Flores</small></span><time>10h – 11h</time></div></div></article><article class="card"><div class="cardhead"><div><h2>Próximas paradas</h2><p>Previsão aproximada de chegada</p></div><button class="textbtn" data-mode="driver">Ver rota</button></div><div class="stops">${orders.filter(x=>x.status!=="Concluída").slice(0,3).map((d,i)=>`<div class="stop"><i class="stopnum">${i+4}</i><span><b>${d.name}</b><small>${d.address.split("·")[1]||"Centro"}</small></span><time>${d.time.split(" – ")[0]}</time></div>`).join("")}</div></article></div></div>
<article class="card tablecard"><div class="cardhead"><div><h2>Entregas de hoje</h2><p>${orders.length} pedidos programados</p></div><div class="tabletools"><label class="search">⌕ <input id="search" placeholder="Buscar pedido"></label></div></div><div class="cardhead" style="padding-top:0"><div class="pills">${["Todas","Em rota","Aguardando","Concluída"].map(x=>`<button class="pill ${filter===x?"active":""}" data-filter="${x}">${x}</button>`).join("")}</div></div><div class="tablewrap"><table class="table"><thead><tr><th>Cliente / pedido</th><th>Endereço</th><th>Previsão</th><th>Status</th><th></th></tr></thead><tbody id="rows">${orders.map(row).join("")}</tbody></table></div></article>`}
function driverView(){const current=orders.find(x=>x.status==="Em rota")||orders.find(x=>x.status==="Próxima")||orders[0];return `<div class="heading"><div><div class="eyebrow">ROTA 03 · CAMINHÃO 02</div><h1>Olá, Rafael 👋</h1><p>São 10h18 · Você tem ${orders.filter(x=>x.status!=="Concluída").length} entregas pela frente.</p></div><span class="online">● Rota iniciada</span></div><div class="mode-hint"><strong>Seu próximo destino</strong> · atualize o status com um toque. As mudanças ficam salvas neste aparelho.</div><div class="driver-layout"><article class="card driver-card"><div class="cardhead"><div><h2>Próxima entrega</h2><p class="route-kicker">Parada 4 de 5 · previsão 10h – 11h</p></div>${statBadge(current.status)}</div><div class="next-card"><div class="label">Pedido ${current.id}</div><h3>${current.name}</h3><p>${current.products}</p><div class="address"><span>📍</span><span>${current.address}</span></div><div style="display:flex;gap:8px;margin-top:13px"><button class="btn soft" id="callClient">☎　Ligar para o cliente</button><button class="btn outline" id="directions">↗　Ver caminho</button></div></div><div class="action-label">Atualizar entrega</div><div class="status-actions"><button class="btn primary" data-status="Estou a caminho"><span class="action-symbol">➜</span>Estou a caminho</button><button class="btn accent" data-status="Concluída"><span class="action-symbol">✓</span>Entrega realizada</button><button class="btn soft" data-status="Não entregue"><span class="action-symbol">!</span>Não foi possível entregar</button></div><p style="font-size:10px;color:var(--muted);margin:12px 0 0">Foto do local é opcional. Adicione apenas se ajudar a registrar uma ocorrência.</p></article><div class="stack"><article class="card"><div class="cardhead"><div><h2>Minha rota</h2><p>Posição aproximada do veículo</p></div></div><div class="map tall">${mapSvg()}</div><div class="progressbox" style="padding-top:14px"><div class="progresslabel"><span>Paradas concluídas</span><b>3 de ${orders.length}</b></div><div class="progress"><i></i></div></div></article><article class="card"><div class="cardhead"><div><h2>Paradas seguintes</h2><p>Você vê só as entregas da sua rota</p></div></div><div class="deliveries-list" style="padding:0 13px 14px">${orders.map((d,i)=>`<div class="delivery-row ${d.id===current.id?"current":""}"><i class="stopnum">${i+1}</i><span><b>${d.name}</b><small>${d.address.split("·")[1]||"Centro"} · ${d.time}</small></span>${statBadge(d.status)}</div>`).join("")}</div></article></div></div>`}
function clientEntry(){return `<div class="client-entry"><section class="card entry-card"><div class="entry-icon">📦</div><div class="eyebrow">ACOMPANHAMENTO DE ENTREGA</div><h2>Sua entrega, no seu tempo.</h2><p>Digite o código que a loja enviou para acompanhar seu pedido. Você não precisa criar uma conta.</p><form class="code-form" id="codeForm"><input id="accessCode" placeholder="Ex.: CR-2841" aria-label="Código de acesso" maxlength="10" required><button class="btn primary">Acompanhar pedido</button></form><div class="error" id="codeError">Não encontramos esse código. Confira e tente novamente.</div><div class="samplecode">Demonstração: use o código <b>CR-2841</b>.</div></section></div>`}
function clientView(){const d=orders.find(x=>x.id===codeOrder);if(!d)return clientEntry();let done=d.status==="Concluída"||d.status==="Recebido";let step=done?3:d.status==="Estou a caminho"?2:d.status==="Em rota"?2:1;return `<div class="client-view"><div class="welcome">PEDIDO ${d.id}　·　OLÁ, ${d.name.split(" ")[0].toUpperCase()}</div><section class="card client-order"><span class="status ${statusClass(d.status)}">${d.status==="Recebido"?"Recebimento confirmado":d.status}</span><h2>${done?"Entrega concluída!":"Acompanhe sua entrega"}</h2><p>${done?"Obrigado por confirmar o recebimento.":"A previsão é aproximada e pode mudar conforme o trânsito."}</p><div class="eta"><small>${done?"STATUS DO PEDIDO":"PREVISÃO DE CHEGADA"}</small><b>${done?"Pedido recebido":"10h – 11h"}</b><span>${done?"Recebimento confirmado":"Você acompanha apenas o seu pedido"}</span></div><div class="timeline"><div class="milestone complete"><i>✓</i>Pedido confirmado</div><div class="milestone ${step>=1?"complete":""}"><i>${step>=1?"✓":"2"}</i>Em separação</div><div class="milestone ${step>=2?"now":""} ${step>2?"complete":""}"><i>${step>2?"✓":"🚚"}</i>Em rota</div><div class="milestone ${done?"complete":""}"><i>${done?"✓":"4"}</i>Entregue</div></div><div class="client-map">${mapSvg()}</div><div class="client-footer"><span class="truckicon">🚚</span><span><b>Seu pedido está a caminho</b><small>Previsão: 10h – 11h · horário aproximado</small></span></div>${done?`<div class="received-note receipt">Recebimento confirmado. Obrigado!</div>`:`<div class="receipt"><button class="btn accent block" id="received">✓　Confirmar que recebi</button></div>`}<button class="textbtn" style="margin-top:12px" id="changeCode">← Consultar outro código</button></section></div>`}
function render(){document.title=mode==="client"?"Acompanhar entrega — Rota Madeira":"Construrota — entregas sem surpresa";if(mode==="manager")$("#app").innerHTML=manager();if(mode==="driver")$("#app").innerHTML=driverView();if(mode==="client")$("#app").innerHTML=clientView();$$("[data-mode]").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));bind()}
function toast(s){const t=$("#toast");t.textContent=s;t.classList.add("show");clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove("show"),2600)}
function setMode(m){mode=m;render();window.scrollTo({top:0,behavior:"smooth"})}
function openModal(html){$("#modal").innerHTML=html;$("#backdrop").classList.add("open")}
function bind(){
$$('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
const add=$("#newOrder");if(add)add.onclick=()=>openModal(`<div class="modalhead"><h2>Nova entrega</h2><button class="iconbtn" data-close>×</button></div><form class="form" id="orderForm"><div class="field"><label>Nome do cliente</label><input id="newName" required placeholder="Ex.: João da Silva"></div><div class="field"><label>WhatsApp</label><input id="newPhone" placeholder="(51) 99999-9999"></div><div class="field full"><label>Endereço de entrega</label><input id="newAddress" required placeholder="Rua, número e bairro"></div><div class="field"><label>Produtos</label><input id="newProduct" placeholder="Cimento, areia..."></div><div class="field"><label>Previsão aproximada</label><select id="newTime"><option>10h – 11h</option><option>11h – 12h</option><option>13h – 14h</option><option>14h – 15h</option></select></div><div class="field full"><label>Observações para o motorista</label><textarea placeholder="Referência ou instruções (opcional)"></textarea></div><div class="formactions"><button type="button" class="btn soft" data-close>Cancelar</button><button class="btn primary">Salvar entrega</button></div></form>`);
const form=$("#orderForm");if(form)form.onsubmit=e=>{e.preventDefault();const n=$("#newName").value.trim(),id="CR-"+(2843+orders.length);orders.unshift({id,name:n,initials:n.split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase(),address:$("#newAddress").value,time:$("#newTime").value,status:"Aguardando",products:$("#newProduct").value||"Produtos diversos",phone:$("#newPhone").value});save();$("#backdrop").classList.remove("open");render();toast("Entrega cadastrada · código "+id)};
$$('[data-close]').forEach(b=>b.onclick=()=>$("#backdrop").classList.remove("open"));
$$('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;$$('[data-filter]').forEach(x=>x.classList.toggle("active",x===b));const q=($("#search")?.value||"").toLowerCase();const filtered=orders.filter(d=>(filter==="Todas"||d.status===filter)&&(`${d.name} ${d.id} ${d.address}`).toLowerCase().includes(q));$("#rows").innerHTML=filtered.length?filtered.map(row).join(""):`<tr><td colspan="5" class="empty">Nenhuma entrega nessa lista.</td></tr>`;bindRows()});
const search=$("#search");if(search)search.oninput=()=>{const q=search.value.toLowerCase(),filtered=orders.filter(d=>(filter==="Todas"||d.status===filter)&&(`${d.name} ${d.id} ${d.address}`).toLowerCase().includes(q));$("#rows").innerHTML=filtered.length?filtered.map(row).join(""):`<tr><td colspan="5" class="empty">Nenhuma entrega encontrada.</td></tr>`;bindRows()};bindRows();
$$('[data-status]').forEach(b=>b.onclick=()=>{const cur=orders.find(x=>x.status==="Em rota")||orders.find(x=>x.status==="Próxima")||orders[0];if(!cur)return;cur.status=b.dataset.status;if(cur.status==="Concluída")cur.time="Entregue agora";save();render();toast(cur.status==="Concluída"?"Entrega marcada como realizada.":cur.status==="Não entregue"?"Ocorrência registrada. Você pode remarcar.":"Cliente avisado: você está a caminho.")});
const cf=$("#codeForm");if(cf)cf.onsubmit=e=>{e.preventDefault();const v=$("#accessCode").value.trim().toUpperCase(),d=orders.find(x=>x.id.toUpperCase()===v);if(!d){$("#codeError").style.display="block";return}codeOrder=d.id;render()};
const received=$("#received");if(received)received.onclick=()=>{const d=orders.find(x=>x.id===codeOrder);if(d){d.status="Recebido";d.time="Recebido pelo cliente";save();render();toast("Recebimento confirmado. Obrigado!")}};
const change=$("#changeCode");if(change)change.onclick=()=>{codeOrder=null;render()};
const call=$("#callClient");if(call)call.onclick=()=>toast("Ligação para o cliente");const directions=$("#directions");if(directions)directions.onclick=()=>toast("Abrindo caminho da próxima entrega");
}
function bindRows(){$$('[data-code]').forEach(b=>b.onclick=()=>{codeOrder=b.dataset.code;setMode("client")})}
function storeModal(){openModal(`<div class="modalhead"><h2>Personalizar minha loja</h2><button class="iconbtn" data-close>×</button></div><div class="settings"><div class="settings-preview"><span class="brandmark" id="brandPreview">${$("#brandmark").innerHTML}</span><span><b>${$("#brandname").textContent}</b><small>Prévia da identidade da loja</small></span></div><div class="field"><label for="storeInput">Nome da loja</label><input id="storeInput" value="${$("#brandname").textContent}"></div><div class="field"><label for="logoInput">Trocar logo (opcional)</label><input id="logoInput" type="file" accept="image/png,image/jpeg,image/webp"></div><button class="btn primary" id="saveBrand">Salvar alterações</button><small style="color:var(--muted);font-size:10px">A personalização desta demonstração fica salva neste navegador.</small></div>`);$("#storeInput").oninput=e=>{$("#brandPreview").innerHTML=e.target.value||"Rota Madeira"};$("#logoInput").onchange=e=>{const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{$("#brandPreview").innerHTML=`<img src="${reader.result}" alt="Prévia do logo">`};reader.readAsDataURL(f)};$("#saveBrand").onclick=()=>{const name=$("#storeInput").value.trim()||"Rota Madeira";$("#brandname").textContent=name;localStorage.setItem("cr-brand-name",name);const image=$("#logoInput").files[0];if(image){const r=new FileReader();r.onload=()=>{localStorage.setItem("cr-brand-logo",r.result);applyBrand()};r.readAsDataURL(image)}else applyBrand();$("#backdrop").classList.remove("open");toast("Identidade da loja atualizada")}}
function applyBrand(){const name=localStorage.getItem("cr-brand-name");if(name)$("#brandname").textContent=name;const img=localStorage.getItem("cr-brand-logo");if(img)$("#brandmark").innerHTML=`<img src="${img}" alt="Logo da loja">`}
$$("[data-mode]").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$("#profile").onclick=storeModal;$("#backdrop").onclick=e=>{if(e.target.id==="backdrop")e.currentTarget.classList.remove("open")};applyBrand();render();
</script></body></html>
