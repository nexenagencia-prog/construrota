<script>

{id:"CR-2841",name:"Marcos Oliveira",initials:"MO",address:"Rua das Acácias, 320 · Jardim das Flores",time:"10h – 11h",status:"Em rota",products:"Areia e cimento",phone:"(51) 99912-3456",routePosition:8,routeTotal:9},

{id:"CR-2838",name:"Ana Costa",initials:"AC",address:"Rua Primavera, 45 · Jardim Paulista",time:"11h – 12h",status:"Próxima",products:"Cimento",phone:"(51) 99966-1830",routePosition:9,routeTotal:9},
{id:"CR-2840",name:"Roberto Almeida",initials:"RA",address:"Rua do Ipê, 82 · Ipiranga",time:"12h – 13h",status:"Aguardando",products:"Brita e areia",phone:"(51) 99771-0054",routePosition:7,routeTotal:9},

];
const clientParam=new URLSearchParams(location.search).get("cliente");let orders=JSON.parse(localStorage.getItem("cr-orders")||"null")||seed.map(x=>({...x}));let mobileTab="deliveries";let mode=clientParam!==null?"client":"manager",filter="Todas",codeOrder=clientParam,activeDeliveryId=(orders.find(x=>x.status==="Em rota")||orders.find(x=>x.status==="Próxima")||orders[0])?.id;
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);const save=()=>localStorage.setItem("cr-orders",JSON.stringify(orders));

function mapSvg(){return `<svg viewBox="0 0 800 360" preserveAspectRatio="xMidYMid slice" aria-label="Mapa ilustrativo da rota"><rect width="800" height="360" fill="var(--map-bg,#123744)"/><path d="M0 46 800 215M-20 285 800 34M125-20 530 380M305-20 700 380M620-40 210 400M-40 180 820 301" stroke="var(--map-road,#254b59)" stroke-width="23"/><path d="M0 46 800 215M-20 285 800 34M-40 180 820 301" stroke="var(--map-road-edge,#416875)" stroke-width="2"/><path d="M110 0 260 360M560 0 390 360" stroke="var(--map-accent,#e99035)" stroke-width="9"/><path d="M95 284c83-60 123-20 204-87s94 10 161-43 116-32 218-98" fill="none" stroke="var(--map-route,#174d38)" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 0"/><path d="M95 284c83-60 123-20 204-87s94 10 161-43" fill="none" stroke="var(--map-route-highlight,#b8dedb)" stroke-width="3" stroke-linecap="round"/><g fill="var(--map-block,#1e4651)"><rect x="25" y="75" width="62" height="36" rx="4"/><rect x="162" y="126" width="78" height="32" rx="4"/><rect x="330" y="28" width="66" height="44" rx="4"/><rect x="450" y="120" width="58" height="39" rx="4"/><rect x="625" y="212" width="80" height="39" rx="4"/><rect x="690" y="77" width="45" height="51" rx="4"/><rect x="36" y="230" width="41" height="30" rx="4"/><rect x="310" y="270" width="80" height="34" rx="4"/></g><g fill="var(--map-label,#a3c4ca)" font-family="sans-serif" font-size="11"><text x="45" y="166">CENTRO</text><text x="605" y="75">VILA NOVA</text><text x="565" y="316">JARDIM DAS FLORES</text></g><circle cx="95" cy="284" r="14" fill="#fff"/><circle cx="95" cy="284" r="9" fill="#e99035" stroke="#fff" stroke-width="3"/><circle cx="680" cy="57" r="17" fill="#fff"/><text x="669" y="64" font-size="18">🚚</text><circle cx="460" cy="154" r="14" fill="#eff8f8" stroke="#fff stroke-width="4"/><text x="456" y="158" font-family="sans-serif" font-size="10" fill="#fff">5</text></svg>`}
function timeOptions(){return Array.from({length:12},(_,i)=>`<option>${i+7}h – ${i+8}h</option>`).join("")}

function row(d){return `<tr><td><div class="client"><i class="avatar">${d.initials}</i><span><b>${d.name}</b><small>Pedido ${d.id}</small></span></div></td><td>${d.address}</td><td>${d.time}</td><td>${statBadge(d.status)}${d.failureReason?`<small class="failure-note" style="display:block;padding:6px 8px;margin-top:5px">${d.failureReason}${d.rescheduleRequested?" · nova tentativa solicitada":""}</small>`:""}</td><td><button class="rowmore" data-share="${d.id}" aria-label="Copiar link do cliente">↗</button><button class="rowmore" data-code="${d.id}" aria-label="Visualizar entrega">›</button></td></tr>`}
function manager(){const routeCount=orders.filter(x=>["Em rota","Próxima"].includes(x.status)).length,done=orders.filter(x=>x.status==="Concluída"||x.status==="Recebido").length;return `<div class="heading"><div><div class="eyebrow">QUARTA-FEIRA · 14 DE OUTUBRO</div><h1><span class="desktop-heading">Bom dia! 👋</span><span class="mobile-heading">Entregas de hoje</span></h1><p>Veja como estão as entregas da sua loja hoje.</p></div><button class="btn primary" id="newOrder">＋　Nova entrega</button></div>
<div class="metrics"><article class="metric"><div class="metricline">Entregas de hoje<span class="metricicon">▣</span></div><strong>${orders.length}<small>pedidos</small></strong></article><article class="metric"><div class="metricline">Em andamento<span class="metricicon">🚚</span></div><strong>${routeCount}<small>na rota</small></strong></article><article class="metric"><div class="metricline">Concluídas<span class="metricicon">✓</span></div><strong>${done}<small>entregues</small></strong></article><article class="metric"><div class="metricline">Precisam de atenção<span class="metricicon" style="background:var(--orange-pale);color:#a9681f">!</span></div><strong>${orders.filter(x=>x.status==="Não entregue").length}<small>ocorrências</small></strong></article></div>
<div class="layout"><article class="card"><div class="cardhead"><div><h2>Rota de hoje</h2><p>Rafael está a caminho das próximas entregas</p></div><button class="textbtn" data-mode="driver">Ver como motorista　→</button></div><div class="map">${mapSvg()}<span class="mapbadge"><i></i>Posição aproximada do caminhão</span></div><div class="route-summary"><span class="truckicon">🚚</span><span><b>Rota 03 · Caminhão 02</b><small>Motorista: Rafael Martins · 5 paradas</small></span><span class="right"><b>3 de 5</b><small>entregas concluídas</small></span></div></article>
<div class="stack"><article class="card"><div class="cardhead"><div><h2>Motorista</h2><p>Rota ativa desde 9h10</p></div><span class="online">● Em rota</span></div><div class="driver"><i class="avatar">RM</i><span><b>Rafael Martins</b><small>Caminhão 02 · placa IXY-4A21</small></span></div><div class="progressbox"><div class="progresslabel"><span>Andamento da rota</span><b>60%</b></div><div class="progress"><i></i></div></div><div class="stops"><div class="stop"><i class="stopnum">4</i><span><b>Próxima parada</b><small>${orders.find(x=>x.status==="Em rota")?.name||"Marcos Oliveira"} · Jardim das Flores</small></span><time>10h – 11h</time></div></div></article><article class="card"><div class="cardhead"><div><h2>Próximas paradas</h2><p>Previsão aproximada de chegada</p></div><button class="textbtn" data-mode="driver">Ver rota</button></div><div class="stops">${orders.filter(x=>x.status!=="Concluída").slice(0,3).map((d,i)=>`<div class="stop"><i class="stopnum">${i+4}</i><span><b>${d.name}</b><small>${d.address.split("·")[1]||"Centro"}</small></span><time>${d.time.split(" – ")[0]}</time></div>`).join("")}</div></article></div></div>
<article class="card tablecard"><div class="cardhead"><div><h2>Entregas de hoje</h2><p>${orders.length} pedidos programados</p></div><div class="tabletools"><label class="search">⌕ <input id="search" placeholder="Buscar pedido"></label></div></div><div class="cardhead" style="padding-top:0"><div class="pills">${["Todas","Em rota","Aguardando","Concluída","Não entregue"].map(x=>`<button class="pill ${filter===x?"active":""}" data-filter="${x}">${x}</button>`).join("")}</div></div><div class="tablewrap"><table class="table"><thead><tr><th>Cliente / pedido</th><th>Endereço</th><th>Previsão</th><th>Status</th><th></th></tr></thead><tbody id="rows">${orders.map(row).join("")}</tbody></table></div></article>`}
function driverView(){const current=orders.find(x=>x.id===activeDeliveryId)||orders.find(x=>x.status==="Em rota")||orders.find(x=>x.status==="Próxima")||orders[0];return `<div class="heading"><div><div class="eyebrow">ROTA 03 · CAMINHÃO 02</div><h1><span class="desktop-heading">Olá, Rafael 👋</span><span class="mobile-heading">Minha rota</span></h1><p>São 10h18 · Você tem ${orders.filter(x=>x.status!=="Concluída").length} entregas pela frente.</p></div><button class="btn primary" id="newOrder">＋　Nova entrega</button></div><div class="mode-hint"><strong>Seu próximo destino</strong> · atualize o status com um toque. As mudanças ficam salvas neste aparelho.</div><div class="driver-layout"><article class="card driver-card"><div class="cardhead"><div><h2>Próxima entrega</h2><p class="route-kicker">Parada ${current.routePosition||8} de ${current.routeTotal||9} · previsão ${current.time}</p></div>${statBadge(current.status)}</div><div class="next-card"><div class="label">Pedido ${current.id}</div><h3>${current.name}</h3><div class="cargo-box"><small>O que será entregue</small><b>📦　${current.products||"Produtos cadastrados na venda"}</b></div>${current.urgent?`<div class="urgency-chip" style="margin-top:9px">⚠ Entrega urgente</div>`:""}<div class="address"><span>📍</span><span>${current.address}</span></div>${current.reference?`<div class="reference">Referência: ${current.reference}</div>`:""}<div style="display:flex;gap:8px;margin-top:13px"><a class="btn soft" id="callClient" href="tel:${current.phone||""}" style="text-decoration:none">☎　Ligar para o cliente</a><a class="btn outline" id="directions" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(current.address)}" target="_blank" rel="noopener" style="text-decoration:none">↗　Ver caminho</a></div><button class="btn outline" id="shareCurrentClient" data-link-id="${current.id}" style="width:100%;margin-top:8px">↗　Copiar link de acompanhamento do cliente</button></div>${current.failureReason?`<div class="failure-note"><b>Tentativa registrada</b><small>${current.failureReason}${current.failureNote?` · ${current.failureNote}`:""}${current.rescheduleRequested?" · Cliente pediu uma nova tentativa":""}</small></div>`:""}<div class="action-label">Atualizar entrega</div><div class="status-actions"><button class="btn primary" data-status="Estou a caminho"><span class="action-symbol">➜</span>Estou a caminho</button><button class="btn accent" data-status="Concluída"><span class="action-symbol">✓</span>Entrega realizada</button><button class="btn soft" data-status="Não entregue"><span class="action-symbol">!</span>Não foi possível entregar</button></div><p style="font-size:10px;color:var(--muted);margin:12px 0 0">Foto do local é opcional. Adicione apenas se ajudar a registrar uma ocorrência.</p></article><div class="stack"><article class="card"><div class="cardhead"><div><h2>Minha rota</h2><p>Posição aproximada do veículo</p></div></div><div class="map tall">${mapSvg()}</div><div class="progressbox" style="padding-top:14px"><div class="progresslabel"><span>Paradas concluídas</span><b>3 de ${orders.length}</b></div><div class="progress"><i></i></div></div></article><article class="card"><div class="cardhead"><div><h2>Paradas seguintes</h2><p>Você vê só as entregas da sua rota</p></div></div><div class="deliveries-list" style="padding:0 13px 14px">${orders.map((d,i)=>`<div class="delivery-row ${d.id===current.id?"current":""}"><i class="stopnum">${i+1}</i><span><b>${d.name}</b><small>${d.address.split("·")[1]||"Centro"} · ${d.time}</small></span>${statBadge(d.status)}</div>`).join("")}</div></article></div></div>`}
function clientEntry(){return `<div class="client-entry"><section class="card entry-card"><div class="entry-icon">📦</div><div class="eyebrow">ACOMPANHAMENTO DE ENTREGA</div><h2>Sua entrega, no seu tempo.</h2><p>Digite o código que a loja enviou para acompanhar seu pedido. Você não precisa criar uma conta.</p><form class="code-form" id="codeForm"><input id="accessCode" placeholder="Ex.: CR-2841" aria-label="Código de acesso" maxlength="10" value="${codeOrder||""}" required><button class="btn primary">Acompanhar pedido</button></form><div class="error" id="codeError">Não encontramos esse código. Confira e tente novamente.</div></section></div>`}
function clientView(){const d=orders.find(x=>x.id===codeOrder);if(!d)return clientEntry();let done=d.status==="Concluída"||d.status==="Recebido",failed=d.status==="Não entregue";let routePosition=d.routePosition||({"CR-2841":8,"CR-2835":4,"CR-2838":9,"CR-2840":7,"CR-2842":6}[d.id]||1),routeTotal=d.routeTotal||9,stopsAhead=Math.max(0,routePosition-1);let step=done?3:d.status==="Estou a caminho"?2:d.status==="Em rota"?2:1;return `<div class="client-view"><div class="welcome">PEDIDO ${d.id}　·　OLÁ, ${d.name.split(" ")[0].toUpperCase()}</div><section class="card client-order"><span class="status ${statusClass(d.status)}">${d.status==="Recebido"?"Recebimento confirmado":d.status}</span><h2>${done?"Entrega concluída!":failed?"Não foi possível entregar":"Acompanhe sua entrega"}</h2><p>${done?"Obrigado por confirmar o recebimento.":failed?"A loja foi avisada e já recebeu o motivo da tentativa.":"A previsão é aproximada e pode mudar conforme o trânsito."}</p>${failed?`<div class="failure-note"><b>Motivo informado pelo motorista</b><small>${d.failureReason||"Tentativa sem sucesso"}${d.failureNote?` · ${d.failureNote}`:""}</small></div>`:""}<div class="eta"><small>${done?"STATUS DO PEDIDO":failed?"TENTATIVA DE ENTREGA":"PREVISÃO DE CHEGADA"}</small><b>${done?"Pedido recebido":failed?"Entrega não concluída":"10h – 11h"}</b><span>${done?"Recebimento confirmado":failed?"A loja pode combinar uma nova previsão":"Você acompanha apenas o seu pedido"}</span></div><div class="queue-position"><span class="queue-number">${routePosition}º</span><span><b>Sua entrega é a ${routePosition}ª parada de ${routeTotal}</b><small>${stopsAhead?`Há aproximadamente ${stopsAhead} entregas antes da sua.`:"Você é a próxima entrega da rota."}</small></span></div><div class="timeline"><div class="milestone complete"><i>✓</i>Pedido confirmado</div><div class="milestone ${step>=1?"complete":""}"><i>${step>=1?"✓":"2"}</i>Em separação</div><div class="milestone ${step>=2?"now":""} ${step>2?"complete":""}"><i>${step>2?"✓":"🚚"}</i>Em rota</div><div class="milestone ${done?"complete":""}"><i>${done?"✓":"4"}</i>Entregue</div></div>${failed?"":`<div class="client-map">${mapSvg()}</div><div class="client-footer"><span class="truckicon">🚚</span><span><b>Seu pedido está a caminho</b><small>Previsão: 10h – 11h · horário aproximado</small></span></div>`}${done?`<div class="received-note receipt">Recebimento confirmado. Obrigado!</div>`:failed?(d.rescheduleRequested?`<div class="received-note receipt">A loja recebeu seu pedido de uma nova tentativa.</div>`:`<div class="receipt"><button class="btn primary block" id="requestRetry">Solicitar nova tentativa</button></div>`):`<div class="receipt"><button class="btn accent block" id="received">✓　Confirmar que recebi</button></div>`}<button class="textbtn" style="margin-top:12px" id="changeCode">← Consultar outro código</button></section></div>`}
function mobileMessagesView(){return `<div class="heading"><div><div class="eyebrow">ROTA 03 · CAMINHÃO 02</div><h1>Mensagens</h1><p>Atualizações e conversas da sua rota.</p></div></div><section class="card message-empty"><div class="message-icon">▤</div><h2>Nenhuma mensagem por enquanto</h2><p>As mensagens da loja e dos clientes aparecerão aqui.</p><button class="btn primary" data-mobile-tab="route">Voltar para minha rota</button></section>`}
function renderMobileNav(){const nav=$("#mobileNav");if(!nav)return;if(mode==="client"){nav.innerHTML="";nav.style.display="none";return}nav.style.display="";const items=[["route","Minha rota","⌖"],["deliveries","Entregas","▤"],["messages","Mensagem","▱"],["more","Mais","•••"]];nav.innerHTML=items.map(([key,label,icon])=>`<button class="mobile-nav-item ${mobileTab===key?"active":""}" data-mobile-tab="${key}" aria-label="${label}"><span class="mobile-nav-icon" aria-hidden="true">${icon}</span><span>${label}</span></button>`).join("");$("#mobileNav [data-mobile-tab]").forEach(b=>b.onclick=()=>mobileNavAction(b.dataset.mobileTab))}
function mobileNavAction(tab){if(tab==="more"){storeModal();return}mobileTab=tab;if(tab==="route"){if(mode!=="driver"){setMode("driver");return}render();window.scrollTo({top:0,behavior:"smooth"});return}if(tab==="messages"){render();window.scrollTo({top:0,behavior:"smooth"});return}render();const target=mode==="driver"?$(".driver-layout .stack article:last-child"):$(".tablecard");if(target)target.scrollIntoView({behavior:"smooth",block:"start"})}
function render(){document.body.classList.toggle("client-mode",mode==="client");document.title=mode==="client"?"Acompanhar entrega — Rota Madeira":"Construrota — entregas sem surpresa";if(mode==="manager")$("#app").innerHTML=mobileTab==="messages"?mobileMessagesView():manager();if(mode==="driver")$("#app").innerHTML=mobileTab==="messages"?mobileMessagesView():driverView();if(mode==="client")$("#app").innerHTML=clientView();$("[data-mode]").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));renderMobileNav();bind()}
function toast(s){const t=$("#toast");t.textContent=s;t.classList.add("show");clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove("show"),2600)}
function setMode(m){mode=m;mobileTab=m==="driver"?"route":"deliveries";if(m!=="client"){const u=new URL(location.href);u.searchParams.delete("cliente");history.replaceState(null,"",u)}$("#roles")?.classList.remove("open");$("#mobileMenu")?.setAttribute("aria-expanded","false");render();window.scrollTo({top:0,behavior:"smooth"})}
function openModal(html){$("#modal").innerHTML=html;$("#backdrop").classList.add("open");bind()}
function failureForm(d){return `<div class="modalhead"><div><h2>Registrar tentativa</h2><p style="margin:4px 0 0;color:var(--muted);font-size:11px">Pedido ${d.id} · ${d.name}</p></div><button class="iconbtn" data-close aria-label="Fechar">×</button></div><form class="form" id="failureForm"><input type="hidden" id="failureOrderId" value="${d.id}"><div class="field full"><label>Por que não foi possível entregar?</label><select id="failureReason" required><option value="">Escolha o motivo</option><option>Cliente ausente no endereço</option><option>Endereço não localizado</option><option>Local sem acesso para o caminhão</option><option>Cliente pediu para remarcar</option><option>Entrega recusada</option><option>Outro</option></select></div><div class="field full"><label>Detalhes para a loja e o cliente (opcional)</label><textarea id="failureDetail" placeholder="Ex.: tentamos ligar, mas não tivemos retorno."></textarea></div><div class="formactions"><button type="button" class="btn soft" data-close>Cancelar</button><button class="btn accent">Registrar ocorrência</button></div><small class="field full" style="color:var(--muted);font-size:10px">O motivo ficará visível para a loja, o motorista e o cliente deste pedido.</small></form>`}
function bind(){
$$('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
const add=$("#newOrder");if(add)add.onclick=()=>openModal(`<div class="modalhead"><h2>Nova entrega</h2><button class="iconbtn" data-close>×</button></div><form class="form" id="orderForm"><div class="field"><label>Nome do cliente</label><input id="newName" required placeholder="Ex.: João da Silva"></div><div class="field"><label>WhatsApp</label><input id="newPhone" placeholder="(51) 99999-9999"></div><div class="field full"><label>Endereço de entrega</label><input id="newAddress" required placeholder="Rua, número e bairro"></div><div class="field"><label>Produtos</label><input id="newProduct" placeholder="Cimento, areia..."></div><div class="field"><label>Previsão aproximada</label><select id="newTime">${timeOptions()}</select></div><div class="field"><label>Prioridade</label><select id="newUrgency"><option value="false">Normal</option><option value="true">Urgente</option></select></div><div class="field full"><label>Referência / observações</label><textarea id="newReference" placeholder="Casa com portão azul, ao lado do mercado... (opcional)"></textarea></div><div class="formactions"><button type="button" class="btn soft" data-close>Cancelar</button><button class="btn primary">Salvar entrega</button></div></form>`);
const form=$("#orderForm");if(form)form.onsubmit=e=>{e.preventDefault();const n=$("#newName").value.trim(),id="CR-"+(2843+orders.length);orders.unshift({id,name:n,initials:n.split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase(),address:$("#newAddress").value,time:$("#newTime").value,status:"Aguardando",products:$("#newProduct").value||"Produtos diversos",phone:$("#newPhone").value,reference:$("#newReference").value,urgent:$("#newUrgency").value==="true",routePosition:Math.min(orders.length+1,9),routeTotal:9});activeDeliveryId=id;save();$("#backdrop").classList.remove("open");render();toast("Entrega cadastrada · código "+id)};
$$('[data-close]').forEach(b=>b.onclick=()=>$("#backdrop").classList.remove("open"));
$$('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;$$('[data-filter]').forEach(x=>x.classList.toggle("active",x===b));const q=($("#search")?.value||"").toLowerCase();const filtered=orders.filter(d=>(filter==="Todas"||d.status===filter)&&(`${d.name} ${d.id} ${d.address}`).toLowerCase().includes(q));$("#rows").innerHTML=filtered.length?filtered.map(row).join(""):`<tr><td colspan="5" class="empty">Nenhuma entrega nessa lista.</td></tr>`;bindRows()});
const search=$("#search");if(search)search.oninput=()=>{const q=search.value.toLowerCase(),filtered=orders.filter(d=>(filter==="Todas"||d.status===filter)&&(`${d.name} ${d.id} ${d.address}`).toLowerCase().includes(q));$("#rows").innerHTML=filtered.length?filtered.map(row).join(""):`<tr><td colspan="5" class="empty">Nenhuma entrega encontrada.</td></tr>`;bindRows()};bindRows();
$$('[data-status]').forEach(b=>b.onclick=()=>{const cur=orders.find(x=>x.id===activeDeliveryId)||orders.find(x=>x.status==="Em rota")||orders.find(x=>x.status==="Próxima")||orders[0];if(!cur)return;if(b.dataset.status==="Não entregue"){openModal(failureForm(cur));return}cur.status=b.dataset.status;if(cur.status==="Concluída"){cur.time="Entregue agora";const next=orders.find(x=>x.status==="Próxima");if(next)activeDeliveryId=next.id}else activeDeliveryId=cur.id;save();render();toast(cur.status==="Concluída"?"Entrega marcada como realizada.":"Cliente avisado: você está a caminho.")});
const failFormEl=$("#failureForm");if(failFormEl)failFormEl.onsubmit=e=>{e.preventDefault();const cur=orders.find(x=>x.id===$("#failureOrderId").value);if(!cur)return;const reason=$("#failureReason").value,detail=$("#failureDetail").value.trim();cur.status="Não entregue";cur.failureReason=reason==="Outro"&&detail?`Outro motivo: ${detail}`:reason;cur.failureNote=detail;cur.failedAt=new Date().toISOString();cur.rescheduleRequested=false;activeDeliveryId=cur.id;save();$("#backdrop").classList.remove("open");render();toast("Ocorrência registrada. A loja e o cliente já podem ver o motivo.")};
const cf=$("#codeForm");if(cf)cf.onsubmit=e=>{e.preventDefault();const v=$("#accessCode").value.trim().toUpperCase(),d=orders.find(x=>x.id.toUpperCase()===v);if(!d){$("#codeError").style.display="block";return}codeOrder=d.id;const u=new URL(location.href);u.searchParams.set("cliente",d.id);history.replaceState(null,"",u);render()};
$("[data-share]").forEach(b=>b.onclick=()=>copyCustomerLink(b.dataset.share));const currentShare=$("#shareCurrentClient");if(currentShare)currentShare.onclick=()=>copyCustomerLink(currentShare.dataset.linkId);
const received=$("#received");if(received)received.onclick=()=>{const d=orders.find(x=>x.id===codeOrder);if(d){d.status="Recebido";d.time="Recebido pelo cliente";save();render();toast("Recebimento confirmado. Obrigado!")}};
const retry=$("#requestRetry");if(retry)retry.onclick=()=>{const d=orders.find(x=>x.id===codeOrder);if(d){d.rescheduleRequested=true;save();render();toast("Pedido de nova tentativa enviado à loja.")}};
const change=$("#changeCode");if(change)change.onclick=()=>{codeOrder=null;const u=new URL(location.href);u.searchParams.set("cliente","");history.replaceState(null,"",u);render()};

}
function bindRows(){$$("[data-code]").forEach(b=>b.onclick=()=>{codeOrder=b.dataset.code;setMode("client")});$$("[data-share]").forEach(b=>b.onclick=()=>copyCustomerLink(b.dataset.share))}
function storeModal(){openModal(`<div class="modalhead"><h2>Personalizar minha loja</h2><button class="iconbtn" data-close>×</button></div><div class="settings"><div class="settings-preview"><span class="brandmark" id="brandPreview">${$("#brandmark").innerHTML}</span><span><b>${$("#brandname").textContent}</b><small>Prévia da identidade da loja</small></span></div><div class="field"><label for="storeInput">Nome da loja</label><input id="storeInput" value="${$("#brandname").textContent}"></div><div class="field"><label for="logoInput">Trocar logo (opcional)</label><input id="logoInput" type="file" accept="image/png,image/jpeg,image/webp"></div><button class="btn primary" id="saveBrand">Salvar alterações</button><small style="color:var(--muted);font-size:10px">A personalização desta demonstração fica salva neste navegador.</small></div>`);$("#storeInput").oninput=e=>{$("#brandPreview").innerHTML=e.target.value||"Rota Madeira"};$("#logoInput").onchange=e=>{const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{$("#brandPreview").innerHTML=`<img src="${reader.result}" alt="Prévia do logo">`};reader.readAsDataURL(f)};$("#saveBrand").onclick=()=>{const name=$("#storeInput").value.trim()||"Rota Madeira";$("#brandname").textContent=name;localStorage.setItem("cr-brand-name",name);const image=$("#logoInput").files[0];if(image){const r=new FileReader();r.onload=()=>{localStorage.setItem("cr-brand-logo",r.result);applyBrand()};r.readAsDataURL(image)}else applyBrand();$("#backdrop").classList.remove("open");toast("Identidade da loja atualizada")}}
function applyBrand(){const name=localStorage.getItem("cr-brand-name");if(name)$("#brandname").textContent=name;const img=localStorage.getItem("cr-brand-logo");if(img)$("#brandmark").innerHTML=`<img src="${img}" alt="Logo da loja">`}
$("[data-mode]").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$("#mobileMenu").onclick=()=>{const open=$("#roles").classList.toggle("open");$("#mobileMenu").setAttribute("aria-expanded",String(open))};document.addEventListener("click",e=>{if(!e.target.closest("#roles")&&!e.target.closest("#mobileMenu")){$("#roles").classList.remove("open");$("#mobileMenu").setAttribute("aria-expanded","false")}});$("#profile").onclick=storeModal;$("#backdrop").onclick=e=>{if(e.target.id==="backdrop")e.currentTarget.classList.remove("open")};applyBrand();render();
</script></body></html>
